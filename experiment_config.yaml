# Experiment configuration for the collision-detection pipeline.
# This documents the parameters actually used to produce results/ — it is
# not (yet) read by the scripts, which take these as CLI-argument defaults;
# treat this file as the single source of truth for what those defaults are.

random_seed: 42

video:
  source_fps: 61.13
  sample_fps: 5.0
  duration_seconds: 768.81
  resolution: [1920, 1080]

data:
  total_ground_truth_events: 89
  total_sampled_frames: 3917
  collision_frames: 558
  collision_rate: 0.1425
  near_miss_frames: 143
  verified_feature_count: 43
  label_window_seconds: 0.5   # padding applied to each ground-truth event's [start, end]

cross_validation:
  strategy: StratifiedGroupKFold
  n_folds: 5
  group_seconds: 5.0          # size of the contiguous chunk kept together in one fold
  val_frac: 0.15              # per-fold slice carved off training data for early stopping
  rationale: >
    Plain chronological KFold left one fold with only 20/783 positives (2.6%)
    purely from where block boundaries fell, collapsing its precision to ~3%.
    StratifiedGroupKFold balances each fold's collision rate to the overall
    14.25% while keeping every event's frames in one group, preventing
    frame-level leakage.

threshold_selection:
  method: pooled_out_of_fold_fbeta
  fbeta: 1.3                  # >1 mildly favors recall
  search_range: precision_recall_curve thresholds (sklearn), not a fixed grid
  smoothing_window_frames: 3  # rolling mean over predicted probabilities before thresholding
  rationale: >
    Per-fold threshold tuning is unstable with only ~100-200 positives per
    fold (can pick a near-zero threshold that flags almost everything
    positive). Pooling all ~3900 out-of-fold probabilities first gives the
    search enough data to be stable.

class_imbalance:
  tree_models: scale_pos_weight = n_negative / n_positive (per training fold)
  random_forest: class_weight="balanced"
  svm: class_weight="balanced"
  temporal_models: pos_weight in BCEWithLogitsLoss = n_negative / n_positive (per training fold)

temporal_models:
  sequence_length_frames: 10   # ~2 seconds of history at 5fps
  architectures: [lstm, gru, tcn]
  hidden_size: 64               # lstm/gru
  tcn_channels: 32
  tcn_kernel_size: 3
  tcn_dilations: [1, 2]
  optimizer: Adam
  learning_rate: 0.001
  weight_decay: 0.00001
  max_epochs: 80
  early_stopping_patience: 12
  batch_size: 64
  feature_scaling: StandardScaler (fit per fold on training sequences only)

model_hyperparameters:
  xgboost: {n_estimators: 800, max_depth: 5, learning_rate: 0.05, subsample: 0.9,
            colsample_bytree: 0.9, min_child_weight: 2, early_stopping_rounds: 40}
  lightgbm: {n_estimators: 800, max_depth: 5, num_leaves: 31, learning_rate: 0.05,
             subsample: 0.9, colsample_bytree: 0.9, min_child_samples: 10, early_stopping_rounds: 40}
  catboost: {iterations: 800, depth: 5, learning_rate: 0.05, early_stopping_rounds: 40}
  random_forest: {n_estimators: 500, max_depth: 10, min_samples_leaf: 3}
  svm: {kernel: rbf, C: 1.0, gamma: scale, probability: true}
