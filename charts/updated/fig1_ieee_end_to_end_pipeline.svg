   <g id="text_2">
    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(24.311523 52.687671)">One recording</text>
    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(12.546766 61.445745)">3,917 sampled frames</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.3px; font-family: 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="160.2" y="35.03251" transform="rotate(-0 160.2 35.03251)">YOLO11n-seg</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(127.053305 53.465492)">TIPL / TIPR / marker</text>
    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(120.211133 61.628018)">Boxes, masks, confidence</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.3px; font-family: 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="288.72" y="35.037211" transform="rotate(-0 288.72 35.037211)">Kalman tracking</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(262.956281 52.69489)">One filter per tip</text>
    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(247.030516 61.438526)">Prediction, age, covariance</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.3px; font-family: 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="439.92" y="35.03251" transform="rotate(-0 439.92 35.03251)">Features</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(399.718781 52.687671)">Original 43 / Kalman (53)</text>
    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(400.216875 61.438526)">Kalman + 2 s history (85)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="299.52" y="7.740625" transform="rotate(-0 299.52 7.740625)">Original 43-feature branch (bypass)</text>
   </g>
   <g id="text_10">
    <text style="font-style: italic; font-size: 7.5px; font-family: 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="260.64" y="86.291367" transform="rotate(-0 260.64 86.291367)">Cached detector measurements are reused; no detector retraining in these comparisons.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.3px; font-family: 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="63.36" y="124.317211" transform="rotate(-0 63.36 124.317211)">Annotations</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(36.838313 146.345492)">64 collision rows</text>
    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(29.753109 155.096346)">Frame labels: +/-0.5 s</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.3px; font-family: 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="230.4" y="124.317211" transform="rotate(-0 230.4 124.317211)">Grouped model evaluation</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(177.467914 145.567671)">24 groups; 5 outer folds; 4 s guard</text>
    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(181.847891 154.508018)">RF / XGBoost; inner validation</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8.3px; font-family: 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="428.4" y="124.317211" transform="rotate(-0 428.4 124.317211)">Score to collision events</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(395.47468 146.340078)">Causal 3-frame mean</text>
    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(373.947766 154.318526)">Validation-selected threshold + gap</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 8.3px; font-family: 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="118.08" y="209.997211" transform="rotate(-0 118.08 209.997211)">Two extraction objectives</text>
   </g>
   <g id="text_18">
